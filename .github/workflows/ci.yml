name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  mcp-server:
    name: MCP server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Validate content library
        run: npm run validate:content
      - run: npm test
